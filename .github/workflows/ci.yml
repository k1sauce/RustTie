name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install bowtie2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bowtie2 zlib1g-dev
      - name: Install bowtie2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install bowtie2
      - name: Build wgsim from source
        run: |
          git clone --depth 1 https://github.com/lh3/wgsim.git /tmp/wgsim
          cc -g -O2 -Wall -o /tmp/wgsim/wgsim /tmp/wgsim/wgsim.c -lz -lm
          sudo install -m 755 /tmp/wgsim/wgsim /usr/local/bin/wgsim
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    name: cargo package (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Verify each crate packages cleanly
        # --workspace packages all members in one invocation so intra-workspace
        # path-deps resolve against the just-packaged siblings instead of
        # crates.io (where 0.0.1 has not been published yet).
        run: cargo package --workspace --no-verify
